; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:stocktv-c3]
; ⚠️ 这不是"精确锁定"：^6.13.0 的含义是 ≥6.13.0 且 <7.0.0 —— 6.x 里出了新版本仍会被拉进来
;    （好处是能自动吃到同主版本的修复；要完全可复现就得写成不带 ^ 的精确版本）。
;    至少它挡住了跨主版本漂移，也挡住了"跑到 7.x/3.x core"这类事。
; 实测 espressif32@6.13.0 → framework-arduinoespressif32 = Arduino core 2.0.17，
; 符合主工程 README 对 core 2.x 的要求。（已知 6.13.0 与 7.0.1 给出的框架相同。）
platform = espressif32@^6.13.0
board = esp32-c3-devkitm-1
framework = arduino
upload_speed = 115200
monitor_speed = 115200
board_build.flash_mode = dio
; 与主工程 README「第一步」指定的方案一致（No OTA: 2MB APP / 2MB SPIFFS）
board_build.partitions = no_ota.csv
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
; 注: 本调试工程只做引脚/背光/屏显的最小验证，不取数、不解析 JSON，
;     所以不需要 ArduinoJson（主工程 arduino/integrated 才需要）。
build_flags =
	; 修正 IDF 的 REG_SPI_BASE —— 必须靠 -include 抢在所有头之前，
	; 放在 tft_setup.h 里【不够】（实测会被 SDK 版盖回去），原因见该文件头部。
	-include include/fix_idf_c3_spi_base.h
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_MOSI=5
	-DTFT_SCLK=3
	-DTFT_CS=-1
	-DTFT_DC=2
	-DTFT_RST=6
	-DTFT_BL=1
	-DTFT_BACKLIGHT_ON=LOW
	-DTFT_INVERSION_ON=1
	-DSPI_FREQUENCY=10000000
	-DSPI_READ_FREQUENCY=5000000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DSMOOTH_FONT
;
; ⚠️⚠️ 上面这一串 -D 就是本工程的【生效显示配置】。
;    与 include/User_Setup.h 内容相同 —— 但那个文件在当前配置下**并不会被使用**
;    （因为定义了 USER_SETUP_LOADED，TFT_eSPI 会跳过 User_Setup_Select.h）。
;    保留它只作为"万一哪天去掉 USER_SETUP_LOADED"的同类兜底，**改配置时请一并改**。
;    主工程那侧是根目录的 TFT_eSPI_Setup.h，三者（这两处 + 主工程那份）需保持一致。
;
; 【为什么不做成"单一来源"——试过，失败了，记录在此免得重蹈】
;   做法：build_flags 只留 USB 两项，显示配置改由 include/tft_setup.h →
;         #include 主工程 TFT_eSPI_Setup.h（TFT_eSPI 2.5.43 支持
;         __has_include(<tft_setup.h>) 这种"随 sketch 的配置"，且该名字与库自带的
;         User_Setup.h 不冲突）。
;   结果：**能编过、宏也全对**（探针确认两个编译单元都拿到 TFT_MOSI=5/RST=6、
;         REG_SPI_BASE 已修正、ELF 里 _spi_user=0x60024010），
;         但**烧进真机后在第一次 Serial.println 就崩**：
;         `Load access fault`，MTVAL=0xC —— 崩在 `Print::write(const char*)` 的
;         虚调用上，Serial 对象的 vptr 为 0（Serial 在 .dram0.bss）
;         ⇒ 像是 C++ 全局构造函数没跑。
;         **A/B 对照确认是这次改动引入的**：同一块板子，旧配置固件跑到
;         `Display test complete!` 一切正常，新配置固件启动即崩。
;   根因**未查明**。⇒ **别再试这条路**，除非能先解释清楚 vptr 为何是 0。
;   （可参考的证据：改后固件体积 +726 字节；两个 TU 的宏状态都已用探针验证一致。）
